<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 520" font-family="Georgia, serif">

  <!-- Sfondo spazio -->
  <rect width="500" height="520" fill="#050510"/>

  <!-- Stelle di sfondo -->
  <circle cx="40" cy="35" r="1" fill="white" opacity="0.6"/>
  <circle cx="130" cy="20" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="290" cy="15" r="1" fill="white" opacity="0.7"/>
  <circle cx="420" cy="40" r="1" fill="white" opacity="0.4"/>
  <circle cx="470" cy="90" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="480" cy="200" r="1" fill="white" opacity="0.5"/>
  <circle cx="460" cy="350" r="1" fill="white" opacity="0.6"/>
  <circle cx="430" cy="460" r="1.5" fill="white" opacity="0.4"/>
  <circle cx="310" cy="490" r="1" fill="white" opacity="0.7"/>
  <circle cx="180" cy="480" r="1" fill="white" opacity="0.5"/>
  <circle cx="50" cy="430" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="20" cy="300" r="1" fill="white" opacity="0.4"/>
  <circle cx="30" cy="160" r="1" fill="white" opacity="0.7"/>

  <!-- Titolo -->
  <text x="250" y="28" text-anchor="middle" fill="#cccccc" font-size="13">Vista dall'interno: l'osservatore ignaro</text>

  <!-- Buco nero (bordo esterno, visto dall'esterno in alto) -->
  <circle cx="250" cy="260" r="200" fill="none" stroke="#ffaa00" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.4"/>
  <text x="250" y="58" text-anchor="middle" fill="#ffaa00" font-size="10" opacity="0.6">orizzonte degli eventi (invisibile dall'interno)</text>

  <!-- Universo interno - leggero alone -->
  <radialGradient id="cosmicGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#1a1a4a" stop-opacity="1"/>
    <stop offset="100%" stop-color="#050510" stop-opacity="1"/>
  </radialGradient>
  <circle cx="250" cy="260" r="195" fill="url(#cosmicGlow)"/>

  <!-- Galassie che si allontanano (frecce verso l'esterno) -->
  <defs>
    <marker id="arrowGal" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#88ccff"/>
    </marker>
    <marker id="arrowGalFaint" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#4477aa"/>
    </marker>
  </defs>

  <!-- Galassia nord -->
  <ellipse cx="250" cy="150" rx="14" ry="7" fill="#aaddff" opacity="0.8" transform="rotate(-10,250,150)"/>
  <line x1="250" y1="140" x2="250" y2="95" stroke="#88ccff" stroke-width="1.5" marker-end="url(#arrowGal)"/>

  <!-- Galassia nord-est -->
  <ellipse cx="340" cy="170" rx="12" ry="6" fill="#aaddff" opacity="0.7" transform="rotate(30,340,170)"/>
  <line x1="348" y1="163" x2="388" y2="128" stroke="#88ccff" stroke-width="1.5" marker-end="url(#arrowGal)"/>

  <!-- Galassia est -->
  <ellipse cx="380" cy="260" rx="13" ry="6" fill="#aaddff" opacity="0.8" transform="rotate(90,380,260)"/>
  <line x1="393" y1="260" x2="435" y2="260" stroke="#88ccff" stroke-width="1.5" marker-end="url(#arrowGal)"/>

  <!-- Galassia sud-est -->
  <ellipse cx="340" cy="348" rx="12" ry="6" fill="#aaddff" opacity="0.7" transform="rotate(150,340,348)"/>
  <line x1="348" y1="355" x2="386" y2="390" stroke="#88ccff" stroke-width="1.5" marker-end="url(#arrowGal)"/>

  <!-- Galassia sud -->
  <ellipse cx="250" cy="370" rx="14" ry="7" fill="#aaddff" opacity="0.8" transform="rotate(10,250,370)"/>
  <line x1="250" y1="378" x2="250" y2="420" stroke="#88ccff" stroke-width="1.5" marker-end="url(#arrowGal)"/>

  <!-- Galassia sud-ovest -->
  <ellipse cx="160" cy="348" rx="12" ry="6" fill="#aaddff" opacity="0.7" transform="rotate(-150,160,348)"/>
  <line x1="152" y1="355" x2="114" y2="390" stroke="#88ccff" stroke-width="1.5" marker-end="url(#arrowGal)"/>

  <!-- Galassia ovest -->
  <ellipse cx="120" cy="260" rx="13" ry="6" fill="#aaddff" opacity="0.8" transform="rotate(90,120,260)"/>
  <line x1="107" y1="260" x2="63" y2="260" stroke="#88ccff" stroke-width="1.5" marker-end="url(#arrowGal)"/>

  <!-- Galassia nord-ovest -->
  <ellipse cx="160" cy="170" rx="12" ry="6" fill="#aaddff" opacity="0.7" transform="rotate(-30,160,170)"/>
  <line x1="152" y1="163" x2="112" y2="128" stroke="#88ccff" stroke-width="1.5" marker-end="url(#arrowGal)"/>

  <!-- Osservatore al centro -->
  <circle cx="250" cy="260" r="18" fill="#1a3a6a" stroke="#44aaff" stroke-width="2"/>
  <!-- Figura stilizzata osservatore -->
  <circle cx="250" cy="252" r="5" fill="#88ccff"/>
  <line x1="250" y1="257" x2="250" y2="272" stroke="#88ccff" stroke-width="2"/>
  <line x1="244" y1="263" x2="256" y2="263" stroke="#88ccff" stroke-width="2"/>
  <line x1="250" y1="272" x2="244" y2="280" stroke="#88ccff" stroke-width="2"/>
  <line x1="250" y1="272" x2="256" y2="280" stroke="#88ccff" stroke-width="2"/>

  <!-- Didascalia osservatore -->
  <text x="275" y="255" fill="#88ccff" font-size="10">osservatore</text>
  <text x="275" y="268" fill="#88ccff" font-size="10">interno</text>

  <!-- Etichetta espansione apparente -->
  <text x="250" y="470" text-anchor="middle" fill="#88ccff" font-size="11" font-style="italic">«Le galassie si allontanano in ogni direzione»</text>
  <text x="250" y="488" text-anchor="middle" fill="#666" font-size="10">(espansione apparente — in realtà: contrazione globale verso la singolarità)</text>

</svg>
